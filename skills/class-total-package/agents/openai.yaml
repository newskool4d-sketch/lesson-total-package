interface:
  display_name: "수업 패키지 설계기"
  short_description: "선택형 수업 모듈 패키지를 연결 설계하는 번들 스킬"
  default_prompt: "Use $class-total-package for two or more linked modules. Route one named module to its direct skill. For an unnamed lesson package, explain the smallest useful combination. Activate all five only for an explicit full package. Check the selected skills, then produce the requested files."
